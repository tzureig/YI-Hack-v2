name: Release

# Push a tag (e.g. "git tag 1.0.1 && git push origin 1.0.1") or start it by
# hand with a version: all camera packages are built and published as a
# GitHub release with SHA256SUMS.txt. The cameras install it automatically
# during the night (AUTO_UPDATE=yes).
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / tag to create (e.g. 1.0.1)'
        required: true
      prerelease:
        description: 'Pre-release (only cameras with update channel "beta" install it)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  SUNXI_TOOLCHAIN: /opt/yi/toolchain-sunxi-musl

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          case "$V" in *[!A-Za-z0-9._+-]*|'') echo "Invalid version '$V'"; exit 1 ;; esac
          echo "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip build-essential \
            bison bisonc++ libbison-dev autoconf autotools-dev libtool libtool-bin \
            automake libssl-dev zlib1g-dev libzzip-dev flex libfl-dev cmake \
            yui-compressor closure-compiler optipng jpegoptim node-less \
            sassc sass-spec libhtml-tidy-perl libxml2-utils rsync qemu-user pkg-config wget bzip2 file
          command -v qemu-arm-static || sudo ln -s "$(command -v qemu-arm)" /usr/local/bin/qemu-arm-static
      - name: Download toolchain
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/lindenis-org/lindenis-v536-prebuilt
          git -C lindenis-v536-prebuilt sparse-checkout set gcc/linux-x86/arm/toolchain-sunxi-musl/toolchain
          sudo mkdir -p ${SUNXI_TOOLCHAIN}
          sudo cp -r lindenis-v536-prebuilt/gcc/linux-x86/arm/toolchain-sunxi-musl/toolchain ${SUNXI_TOOLCHAIN}/
      - name: Build
        run: bash -ex scripts/compile.sh
      - name: Pack
        run: sudo -E YI_RELEASE=1 bash -ex scripts/pack_fw.all.sh
      - name: Checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          cd out/all
          ls *.tgz
          sha256sum *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign checksums
        env:
          FW_SIGN_KEY: ${{ secrets.FW_SIGN_KEY }}
        run: |
          # The cameras only install a release whose SHA256SUMS.txt carries this
          # Ed25519 signature (public key: src/fwverify/fw_sign.pub)
          if [ -z "$FW_SIGN_KEY" ]; then
            echo "::error::Secret FW_SIGN_KEY is missing, cameras would refuse this release"
            exit 1
          fi
          umask 077
          printf '%s\n' "$FW_SIGN_KEY" > /tmp/fw_sign_key.pem
          cd out/all
          openssl pkeyutl -sign -inkey /tmp/fw_sign_key.pem -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f /tmp/fw_sign_key.pem
          # Check the signature against the public key the firmware contains
          PUB_HEX=$(tr -d ' \n' < ../../src/fwverify/fw_sign.pub)
          python3 -c "import sys;open('/tmp/fw_sign_pub.der','wb').write(bytes.fromhex('302a300506032b6570032100'+sys.argv[1]))" "$PUB_HEX"
          openssl pkey -pubin -inform DER -in /tmp/fw_sign_pub.der -out /tmp/fw_sign_pub.pem
          openssl pkeyutl -verify -pubin -inkey /tmp/fw_sign_pub.pem -rawin -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig
      - name: Check packages
        run: |
          # Every package must contain the version, the signature checker and the upgrade marker
          cd out/all
          for P in *.tgz; do
            tar tzf "$P" > /tmp/list.txt
            for F in yi-hack/version yi-hack/model_suffix yi-hack/fw_upgrade_in_progress yi-hack/bin/fwverify; do
              grep -qx "$F" /tmp/list.txt || { echo "::error::$F missing in $P"; exit 1; }
            done
            [ "$(tar xzf "$P" -O yi-hack/version)" = "${{ steps.ver.outputs.version }}" ] || { echo "::error::wrong version in $P"; exit 1; }
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.ver.outputs.version, '-') }}
          files: |
            out/all/*.tgz
            out/all/SHA256SUMS.txt
            out/all/SHA256SUMS.txt.sig
