name: Detector image

# Builds ghcr.io/<owner>/yi-detector for amd64 + arm64 (Raspberry Pi 4/5,
# Home Assistant Green/Yellow, NAS) whenever the detector changes.
on:
  push:
    branches: [main]
    paths:
      - 'detector/**'
      - '.github/workflows/detector-image.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/yi-detector" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^version:' ha-addon/yi-detector/config.yaml | sed 's/version: *//; s/\"//g')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: detector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
